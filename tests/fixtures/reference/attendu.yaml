# Indicateurs à D, par Entité : statut, motif ("" si évalué), valeur [n, d] et couleur.
# Seuils de la Grille par défaut : IND-1 rouge >= 3, orange >= 1 ; IND-2 rouge > 10,
# orange > 5 ; IND-3 rouge >= 20, orange >= 10, jaune >= 5 ; IND-4 rouge >= 0.20,
# orange >= 0.10, jaune >= 0.05 ; IND-5 rouge >= 1 ; IND-6 orange >= 2, jaune >= 1 ;
# IND-7 orange > 1.5, jaune > 1.0 ; IND-8 orange >= 0.05, jaune >= 0.03.
# Garde-fous : IND-4 à partir de 20 Cas de test exécutés ; IND-7 à partir de 5 Entrées.
indicateurs:
  ENT-A:
    # REF-1, REF-2, REF-3 : 3 >= 3 (seuil atteint).
    IND-1:
      statut: evalue
      motif: ""
      valeur: [3, 1]
      couleur: rouge
    # Plus ancienne bloquante ouverte REF-1, 9 Jours ouvrés : > 5, pas > 10.
    IND-2:
      statut: evalue
      motif: ""
      valeur: [9, 1]
      couleur: orange
    # REF-6, 7, 8, 9, 11 : 5 >= 5 (seuil jaune atteint).
    IND-3:
      statut: evalue
      motif: ""
      valeur: [5, 1]
      couleur: jaune
    # Recette : 5 KO / 21 exécutés (21 >= 20, garde-fou satisfait) ; 5/21 >= 1/5. Les Cas de
    # test tnr REF-46, REF-47 sont hors Phase en cours.
    IND-4:
      statut: evalue
      motif: ""
      valeur: [5, 21]
      couleur: rouge
    # REF-20 (V1) ; REF-22 refusée en V2, hors Vague en cours.
    IND-5:
      statut: evalue
      motif: ""
      valeur: [1, 1]
      couleur: rouge
    # REF-21 ; REF-20 n'est plus réservée à D.
    IND-6:
      statut: evalue
      motif: ""
      valeur: [1, 1]
      couleur: jaune
    # Bloquantes + majeures : Entrées REF-7, 2, 5, 3, 8, 9 = 6 (>= 5, garde-fou satisfait ;
    # REF-13 mineure exclue) ; Sorties REF-4, 10, 5, 12 = 4. 6/4 = 1,5 : pas > 1.5, > 1.0.
    IND-7:
      statut: evalue
      motif: ""
      valeur: [6, 4]
      couleur: jaune
    # IND-4 évaluable aux deux dates : 5/21 (D) − 2/20 (J-5, 20 exécutés) = 50/210 − 21/210
    # = 29/210 (fraction réduite) >= 0.05.
    IND-8:
      statut: evalue
      motif: ""
      valeur: [29, 210]
      couleur: orange
  ENT-B:
    # Aucune bloquante ouverte (REF-14 fermée le 15/09).
    IND-1:
      statut: evalue
      motif: ""
      valeur: [0, 1]
      couleur: vert
    IND-2:
      statut: non_evaluable
      motif: "aucune Anomalie bloquante ouverte"
      valeur: [0, 0]
      couleur: vert
    # REF-15, 16, 18 : 3 < 5.
    IND-3:
      statut: evalue
      motif: ""
      valeur: [3, 1]
      couleur: vert
    # 10 Cas de test exécutés (2 KO, 20 % : rouge s'il était évalué) < 20.
    IND-4:
      statut: non_evaluable
      motif: "10 Cas de test exécuté(s) en Phase recette le 2026-09-18, en deçà du garde-fou de 20"
      valeur: [0, 0]
      couleur: vert
    IND-5:
      statut: evalue
      motif: ""
      valeur: [0, 1]
      couleur: vert
    IND-6:
      statut: evalue
      motif: ""
      valeur: [0, 1]
      couleur: vert
    # Entrées REF-15, 16, 17, 18 = 4 < 5 (Sorties REF-14, 17 = 2).
    IND-7:
      statut: non_evaluable
      motif: "4 Entrée(s) d'Anomalies bloquantes ou majeures sur la Fenêtre glissante, en deçà du garde-fou de 5"
      valeur: [0, 0]
      couleur: vert
    # IND-4 non évaluable à D.
    IND-8:
      statut: non_evaluable
      motif: "IND-4 non évaluable le 2026-09-18 (10 Cas de test exécuté(s) en Phase recette le 2026-09-18, en deçà du garde-fou de 20)"
      valeur: [0, 0]
      couleur: vert

# Météo à D : couleur la plus grave ; toutes les Règles déclenchantes de cette couleur, dans
# l'ordre IND-1..IND-8, avec valeur, opérateur, seuil [n, d] et tickets en cause.
meteo:
  ENT-A:
    # Rouges : IND-1, IND-4, IND-5 (oranges IND-2, IND-8 et jaunes non restitués).
    couleur: rouge
    regles:
      - code: IND-1
        operateur: ">="
        valeur: [3, 1]
        seuil: [3, 1]
        # Bloquantes ouvertes.
        tickets_en_cause: [REF-1, REF-2, REF-3]
      - code: IND-4
        operateur: ">="
        valeur: [5, 21]
        # 0.20 = 1/5.
        seuil: [1, 5]
        # Cas de test KO de la recette à D.
        tickets_en_cause: [REF-24, REF-25, REF-26, REF-43, REF-44]
      - code: IND-5
        operateur: ">="
        valeur: [1, 1]
        seuil: [1, 1]
        # Certification refusée de la Vague en cours.
        tickets_en_cause: [REF-20]
  ENT-B:
    # Aucun indicateur évalué ne franchit de seuil ; les non évaluables ne comptent pas.
    couleur: vert
    regles: []

# Empreinte attendue de la Grille figée du jeu (12 premiers hex du SHA-256 de
# `grille_meteo.yaml`), portée par chaque Météo : toute modification de la Grille la change.
version_grille: c344967e71de

# Variantes de la Météo à D : Grille du jeu dont les indicateurs listés sont inactifs, pour
# réconcilier l'agrégation orange et jaune et les tickets en cause des autres règles (triés
# par numéro de clé : REF-9 avant REF-11). Les valeurs mesurées sont celles d'`indicateurs`.
meteo_variantes:
  - inactifs: [IND-1, IND-4, IND-5]
    meteo:
      ENT-A:
        # Restent IND-2 orange, IND-3 jaune, IND-6 jaune, IND-7 jaune, IND-8 orange : orange.
        couleur: orange
        regles:
          - code: IND-2
            operateur: ">"
            # REF-1 : 9 Jours ouvrés > 5.
            valeur: [9, 1]
            seuil: [5, 1]
            # La plus ancienne bloquante ouverte.
            tickets_en_cause: [REF-1]
          - code: IND-8
            operateur: ">="
            # 5/21 − 2/20 = 29/210 >= 0.05 ; IND-4 inactif mais toujours mesuré pour IND-8.
            valeur: [29, 210]
            # 0.05 = 1/20.
            seuil: [1, 20]
            # Cas de test KO de la recette à D.
            tickets_en_cause: [REF-24, REF-25, REF-26, REF-43, REF-44]
      ENT-B:
        # IND-2, IND-7, IND-8 non évaluables ; IND-3 (3), IND-6 (0) verts.
        couleur: vert
        regles: []
  - inactifs: [IND-1, IND-2, IND-4, IND-5, IND-8]
    meteo:
      ENT-A:
        # Restent IND-3, IND-6, IND-7, tous jaunes.
        couleur: jaune
        regles:
          - code: IND-3
            operateur: ">="
            valeur: [5, 1]
            seuil: [5, 1]
            # Majeures ouvertes à D (REF-11 devenue majeure le 15/09).
            tickets_en_cause: [REF-6, REF-7, REF-8, REF-9, REF-11]
          - code: IND-6
            operateur: ">="
            valeur: [1, 1]
            seuil: [1, 1]
            # Certification réservée de la Vague en cours.
            tickets_en_cause: [REF-21]
          - code: IND-7
            operateur: ">"
            # 6 Entrées / 4 Sorties, non réduit ; 1,5 > 1.0.
            valeur: [6, 4]
            # 1.0 = 1/1.
            seuil: [1, 1]
            # Bloquantes ou majeures entrées (REF-2, 3, 5, 7, 8, 9) ou sorties (REF-4, 5, 10,
            # 12) sur la Fenêtre glissante ; REF-13 mineure exclue.
            tickets_en_cause: [REF-2, REF-3, REF-4, REF-5, REF-7, REF-8, REF-9, REF-10, REF-12]
      ENT-B:
        # IND-3 (3) et IND-6 (0) verts ; IND-7 non évaluable.
        couleur: vert
        regles: []
