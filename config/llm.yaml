# Couche LLM (AD-12, AD-13, H-23), lue par la composition seulement : fournisseur et modèle
# se changent ici, sans modification de code. Le modèle doit figurer dans le registre des
# quotas et des prix (`src/usine/adaptateurs/llm/registre.py`).

# Fournisseur : anthropic (clé ANTHROPIC_API_KEY), mistral (clé MISTRAL_API_KEY) ou local
# (llama-server, sans clé ; voir le bloc « mode local » en bas).
fournisseur: anthropic
# Modèle du fournisseur, par exemple claude-sonnet-5-5 ou mistral-large-latest.
modele: claude-sonnet-5-5
# Plafond de coût estimé par Passage, en euros (NFR-9) : une fois atteint, plus aucun appel
# frais au fournisseur ; le cache reste servi et les tâches se dégradent (explication
# indisponible) sans faire échouer le Passage. 2 € couvrent largement un Passage de démo.
plafond_cout_passage_eur: 2.00
# Tentatives maximales d'un appel repris sur 429 (attente croissante, Retry-After respecté).
tentatives_max: 5
# Température des appels ; ignorée par les modèles Claude qui ne l'acceptent plus.
temperature: 0.0
# Modèle par tâche (classification, explication, narration, agent), du même fournisseur ; une
# tâche absente utilise `modele`.
modeles_par_tache:
  # Classification des Causes racines, un appel par Anomalie : Haiku 5.5, environ 0,30 € pour
  # tout le stock contre 10 € sur Sonnet 5.5. Changer ce modèle change la clé de cache : le
  # stock est reclassé, dans la limite de la part du plafond.
  classification: claude-haiku-5-5

# --- Mode LLM local (FR-37) : llama-server, sans clé ni appel distant. Voir docs/mode-llm-local.md.
# Remplacer `fournisseur`, `modele` et `modeles_par_tache` ci-dessus par :
#   fournisseur: local
#   modele: ministral-3-8b
#   modeles_par_tache:
#     classification: ministral-3-8b
# URL du serveur : variable USINE_URL_LLM_LOCAL (défaut http://127.0.0.1:8080/v1).
