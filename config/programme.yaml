# Programme fictif « Banque Exemple — migration SI cœur » (Story 1.1), lu par `usine donnees`.
# Tout est fictif : aucun nom réel d'entreprise ni de personne.
#
# Scénarios de démo A, B et C (Story 1.5, FR-3) : portés par ENT-A, ENT-B et ENT-C (Vague V1),
# leurs paramètres sont lus dans la clé `scenarios` en fin de fichier (contrats 1.1.0). Ses
# valeurs sont celles de `SCENARIOS_PAR_DEFAUT` (`src/usine/generateur/scenarios.py`), repli
# du générateur quand la clé est absente. Changer les Entités ou le calendrier de V1 décale
# les Scénarios ; `usine donnees generer --sans-scenarios` les désactive tous.

# Nom du Programme de migration.
nom: Banque Exemple — migration SI cœur
# Graine du tirage par défaut : même graine et même date de génération, même Journal.
graine: 42
# Nombre de semaines du Programme, jusqu'à la semaine de la Date d'injection comprise.
nb_semaines: 8

# Entités pilotées ; chacune appartient à une seule Vague.
entites:
  # Code de l'Entité (forme ENT-XXX).
  - code: ENT-A
    # Libellé affiché de l'Entité.
    libelle: Entité Alpha
    # Code de la Vague de migration de l'Entité.
    vague: V1
  # Code de l'Entité (forme ENT-XXX).
  - code: ENT-B
    # Libellé affiché de l'Entité.
    libelle: Entité Bêta
    # Code de la Vague de migration de l'Entité.
    vague: V1
  # Code de l'Entité (forme ENT-XXX).
  - code: ENT-C
    # Libellé affiché de l'Entité.
    libelle: Entité Gamma
    # Code de la Vague de migration de l'Entité.
    vague: V1
  # Code de l'Entité (forme ENT-XXX).
  - code: ENT-D
    # Libellé affiché de l'Entité.
    libelle: Entité Delta
    # Code de la Vague de migration de l'Entité.
    vague: V1
  # Code de l'Entité (forme ENT-XXX).
  - code: ENT-E
    # Libellé affiché de l'Entité.
    libelle: Entité Epsilon
    # Code de la Vague de migration de l'Entité.
    vague: V2
  # Code de l'Entité (forme ENT-XXX).
  - code: ENT-F
    # Libellé affiché de l'Entité.
    libelle: Entité Zêta
    # Code de la Vague de migration de l'Entité.
    vague: V2
  # Code de l'Entité (forme ENT-XXX).
  - code: ENT-G
    # Libellé affiché de l'Entité.
    libelle: Entité Êta
    # Code de la Vague de migration de l'Entité.
    vague: V2
  # Code de l'Entité (forme ENT-XXX).
  - code: ENT-H
    # Libellé affiché de l'Entité.
    libelle: Entité Thêta
    # Code de la Vague de migration de l'Entité.
    vague: V3
  # Code de l'Entité (forme ENT-XXX).
  - code: ENT-I
    # Libellé affiché de l'Entité.
    libelle: Entité Iota
    # Code de la Vague de migration de l'Entité.
    vague: V3
  # Code de l'Entité (forme ENT-XXX).
  - code: ENT-J
    # Libellé affiché de l'Entité.
    libelle: Entité Kappa
    # Code de la Vague de migration de l'Entité.
    vague: V3

# Vagues de migration et calendrier de leurs Phases, en semaines du Programme.
vagues:
  # Code de la Vague.
  - code: V1
    # Libellé affiché de la Vague.
    libelle: Vague 1
    # Phases de test de la Vague, dans l'ordre.
    phases:
      # Phase de test : migration à blanc.
      - phase: migration_a_blanc
        # Première semaine de la Phase (1 = semaine de l'ancrage).
        semaine_debut: 1
        # Dernière semaine de la Phase.
        semaine_fin: 2
      # Phase de test : recette.
      - phase: recette
        # Première semaine de la Phase.
        semaine_debut: 3
        # Dernière semaine de la Phase.
        semaine_fin: 5
      # Phase de test : tests de non-régression.
      - phase: tnr
        # Première semaine de la Phase.
        semaine_debut: 6
        # Dernière semaine de la Phase.
        semaine_fin: 8
  # Code de la Vague.
  - code: V2
    # Libellé affiché de la Vague.
    libelle: Vague 2
    # Phases de test de la Vague, dans l'ordre.
    phases:
      # Phase de test : migration à blanc.
      - phase: migration_a_blanc
        # Première semaine de la Phase (1 = semaine de l'ancrage).
        semaine_debut: 1
        # Dernière semaine de la Phase.
        semaine_fin: 3
      # Phase de test : recette.
      - phase: recette
        # Première semaine de la Phase.
        semaine_debut: 4
        # Dernière semaine de la Phase.
        semaine_fin: 6
      # Phase de test : tests de non-régression.
      - phase: tnr
        # Première semaine de la Phase.
        semaine_debut: 7
        # Dernière semaine de la Phase.
        semaine_fin: 8
  # Code de la Vague.
  - code: V3
    # Libellé affiché de la Vague.
    libelle: Vague 3
    # Phases de test de la Vague, dans l'ordre.
    phases:
      # Phase de test : migration à blanc.
      - phase: migration_a_blanc
        # Première semaine de la Phase (1 = semaine de l'ancrage).
        semaine_debut: 1
        # Dernière semaine de la Phase.
        semaine_fin: 4
      # Phase de test : recette.
      - phase: recette
        # Première semaine de la Phase.
        semaine_debut: 5
        # Dernière semaine de la Phase.
        semaine_fin: 7
      # Phase de test : tests de non-régression.
      - phase: tnr
        # Première semaine de la Phase.
        semaine_debut: 8
        # Dernière semaine de la Phase.
        semaine_fin: 8

# Domaines fonctionnels des tickets.
domaines:
  - credits
  - depots
  - paiements
  - referentiel_clients
  - comptabilite
  - epargne

# Volumétrie cible du générateur, sur les `nb_semaines` du Programme.
volumetrie:
  # Nombre minimal d'Anomalies générées, toutes Entités confondues.
  anomalies_min: 3000
  # Nombre maximal d'Anomalies générées (H-2, modifiée le 12/10/2026 : 3 000 à 4 000).
  # Chaque Anomalie compte au moins une Entrée (sa création) : le générateur tire dans
  # l'intersection avec `nb_semaines` × bornes d'Entrées par semaine (1 600 à 4 000, d'où ici
  # 3 000 à 4 000), proratisées pour une dernière semaine partielle. Il réserve aussi 10 % du maximum
  # hebdomadaire aux réouvertures (au plus 450 créations par semaine), d'où environ 3 000 à
  # 3 600 Anomalies. La mesure NFR-2 garde son propre majorant de 5 000 (`outils/`).
  anomalies_max: 4000
  # Nombre minimal d'Entrées d'Anomalies (créations et réouvertures) par semaine.
  entrees_semaine_min: 200
  # Nombre maximal d'Entrées d'Anomalies (créations et réouvertures) par semaine.
  entrees_semaine_max: 500

# Scénarios de démo (FR-3, contrats 1.2.0), calés au jour près sur le calendrier de V1 avec la
# Grille livrée (Story 1.8). Clé `scenarios` absente ou vide (`null`) : Scénarios par défaut
# du générateur ; `scenarios: {}` les désactive tous. Sous la clé, un Scénario absent (ou
# `null`) est désactivé. Chacun vise une Entité du Programme, distincte de celles des autres ;
# le générateur ignore un Scénario dont une semaine dépasse l'historique généré.
scenarios:
  # Scénario A, « sortie de crise » : vague de bloquantes de reprise de données, puis décrue.
  sortie:
    # Entité portant le Scénario A.
    entite: ENT-A
    # Semaine du Programme de la vague de bloquantes (bascule au rouge son premier Jour ouvré).
    semaine_vague: 6
    # Bloquantes scriptées créées le premier Jour ouvré de la vague (prises sur la semaine).
    bloquantes_bascule: 4
    # Bloquantes scriptées de la semaine de vague (hors bascule), puis de chaque semaine
    # suivante (la dernière valeur se répète), réparties sur les Jours ouvrés.
    bloquantes_par_semaine: [9, 2, 4]
    # Jours ouvrés entre la création et la fermeture d'une bloquante scriptée (4 à 10).
    duree_bloquantes: 7
    # Poids de l'Entité dans le tirage des créations pendant la vague (Entité normale : 1).
    poids_vague: 1.5
    # Poids de l'Entité dans le tirage des créations après la vague (décrue).
    poids_decrue: 0.25
    # Statut de la Certification de l'Entité (accordee, reservee ou refusee).
    statut_certification: accordee
    # Semaine de création de la Certification (premier Jour ouvré).
    semaine_certification: 3
  # Scénario B, « enlisement » : bloquantes qui arrivent plus vite qu'elles ne sortent.
  enlisement:
    # Entité portant le Scénario B.
    entite: ENT-B
    # Première semaine de l'enlisement (bascule au rouge son premier Jour ouvré).
    semaine_debut: 2
    # Bloquantes scriptées créées le premier Jour ouvré de `semaine_debut` (prises sur la
    # semaine).
    bloquantes_bascule: 3
    # Bloquantes scriptées de `semaine_debut` (hors bascule), puis de chaque semaine suivante
    # (la dernière valeur se répète), réparties sur les Jours ouvrés.
    bloquantes_par_semaine: [3, 3, 4, 4, 5, 5, 6]
    # Jours ouvrés entre la création et la fermeture d'une bloquante scriptée (4 à 10).
    duree_bloquantes: 8
    # Poids de l'Entité dans le tirage des créations dès `semaine_debut` (Entité normale : 1).
    poids: 3.0
    # Part des créations enlisées tirées qui sont majeures (le reste : mineures ; aucune
    # bloquante tirée).
    part_majeures: 0.03
    # Statut de la Certification de l'Entité (accordee, reservee ou refusee). Réservée et non
    # refusée : IND-5 rendrait la règle non projetable et masquerait « pas de sortie projetée ».
    statut_certification: reservee
    # Semaine de création de la Certification (premier Jour ouvré).
    semaine_certification: 4
  # Scénario C, « menace » : Cas de test nombreux dont le taux de KO monte (orange en fin).
  menace:
    # Entité portant le Scénario C.
    entite: ENT-C
    # Cas de test d'une semaine pleine, créés et exécutés chaque Jour ouvré.
    cas_de_test_par_semaine: 50
    # Taux de KO cumulé visé dans la Phase avant `semaine_hausse`.
    taux_ko_initial: 0.03
    # Première semaine de la hausse du taux de KO visé.
    semaine_hausse: 4
    # Taux de KO cumulés visés semaine après semaine dès `semaine_hausse` (le dernier se répète).
    taux_ko_hausse: [0.045, 0.065, 0.07, 0.14, 0.18]
    # Semaine de création de la Certification, réservée (premier Jour ouvré).
    semaine_certification: 4
