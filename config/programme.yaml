# Programme fictif « Banque Exemple — migration SI cœur » (Story 1.1), lu par `usine donnees`.
# Tout est fictif : aucun nom réel d'entreprise ni de personne.

# Nom du Programme de migration.
nom: Banque Exemple — migration SI cœur
# Graine du tirage par défaut : même graine et même date de génération, même Journal.
graine: 42
# Nombre de semaines du Programme, jusqu'à la semaine de la Date d'injection comprise.
nb_semaines: 8

