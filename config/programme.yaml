# Vagues de migration et calendrier de leurs Phases, en semaines du Programme.
vagues:
  # Code de la Vague.
  - code: V1
    # Libellé affiché de la Vague.
    libelle: Vague 1
    # Phases de test de la Vague, dans l'ordre.
    phases:
      # Phase de test : migration à blanc.
      - phase: migration_a_blanc
        # Première semaine de la Phase (1 = semaine de l'ancrage).
        semaine_debut: 1
        # Dernière semaine de la Phase.
        semaine_fin: 2
      # Phase de test : recette.
      - phase: recette
        # Première semaine de la Phase.
        semaine_debut: 3
        # Dernière semaine de la Phase.
        semaine_fin: 5
      # Phase de test : tests de non-régression.
      - phase: tnr
        # Première semaine de la Phase.
        semaine_debut: 6
        # Dernière semaine de la Phase.
        semaine_fin: 8
  # Code de la Vague.
  - code: V2
    # Libellé affiché de la Vague.
    libelle: Vague 2
    # Phases de test de la Vague, dans l'ordre.
    phases:
      # Phase de test : migration à blanc.
      - phase: migration_a_blanc
        # Première semaine de la Phase (1 = semaine de l'ancrage).
        semaine_debut: 1
        # Dernière semaine de la Phase.
        semaine_fin: 3
      # Phase de test : recette.
      - phase: recette
        # Première semaine de la Phase.
        semaine_debut: 4
        # Dernière semaine de la Phase.
        semaine_fin: 6
      # Phase de test : tests de non-régression.
      - phase: tnr
